name: checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobacion del parche
        run: python tools/comprobar.py
      - name: Mayusculas en menus
        run: python tools/dev/check_caps.py
      - name: Interfaz ES completa y sin duplicados
        run: python tools/ci_check.py
